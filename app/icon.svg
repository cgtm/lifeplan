<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <!-- Arms fade from amber at centre to cream at tips -->
    <linearGradient id="armN" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#e7e5e4"/>
      <stop offset="100%" stop-color="#fafaf9"/>
    </linearGradient>
    <linearGradient id="armS" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#d6d3d1"/>
      <stop offset="100%" stop-color="#a8a29e"/>
    </linearGradient>
    <linearGradient id="armE" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#d6d3d1"/>
      <stop offset="100%" stop-color="#a8a29e"/>
    </linearGradient>
    <linearGradient id="armW" x1="1" y1="0.5" x2="0" y2="0.5">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#e7e5e4"/>
      <stop offset="100%" stop-color="#fafaf9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#44403c" stroke-width="1.5"/>

  <!-- Cardinal points — soft curves, gradient from amber centre to cream/stone tips -->
  <!-- North -->
  <path d="M256 68 Q270 200 272 228 L256 248 L240 228 Q242 200 256 68 Z" fill="url(#armN)"/>
  <!-- South -->
  <path d="M256 444 Q270 312 272 284 L256 264 L240 284 Q242 312 256 444 Z" fill="url(#armS)"/>
  <!-- East -->
  <path d="M444 256 Q312 242 284 240 L264 256 L284 272 Q312 270 444 256 Z" fill="url(#armE)"/>
  <!-- West -->
  <path d="M68 256 Q200 242 228 240 L248 256 L228 272 Q200 270 68 256 Z" fill="url(#armW)"/>

  <!-- Diagonal points — light stone, clearly visible -->
  <!-- NW -->
  <path d="M136 136 Q208 208 228 228 L240 248 L224 248 Q208 232 136 136 Z" fill="#d6d3d1"/>
  <!-- NE -->
  <path d="M376 136 Q304 208 284 228 L272 248 L288 248 Q304 232 376 136 Z" fill="#d6d3d1"/>
  <!-- SE -->
  <path d="M376 376 Q304 304 284 284 L272 264 L288 264 Q304 280 376 376 Z" fill="#a8a29e"/>
  <!-- SW -->
  <path d="M136 376 Q208 304 228 284 L240 264 L224 264 Q208 280 136 376 Z" fill="#a8a29e"/>

  <!-- Centre -->
  <circle cx="256" cy="256" r="22" fill="#d97706"/>
  <circle cx="256" cy="256" r="10" fill="#292524"/>
  <circle cx="256" cy="256" r="4" fill="#d97706" opacity="0.5"/>
</svg>
